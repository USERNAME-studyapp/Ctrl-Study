{% extends "base.html" %}

{% block body %}
{% if error %}
<p>{{ error }}</p>
{% endif %}
<form method="POST" action="">
    {{ form.hidden_tag() }}
    <div>
        {{ form.username.label }}
        {{ form.username() }}
    </div>
    <div>
        {{ form.password.label }}
        {{ form.password() }}
    </div>
    <div>
        {{ form.submit() }}
    </div>
</form>
{% endblock %}
