{% extends "base.html" %}
{% block head %}
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Template Question Builder</title>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const templateBox = document.getElementById("template_text");
    if (!templateBox) return;

    templateBox.addEventListener("keydown", function (event) {
      if (event.key !== "Tab") return;
      event.preventDefault();

      const start = templateBox.selectionStart;
      const end = templateBox.selectionEnd;
      const value = templateBox.value;
      const tab = "\t";

      templateBox.value = value.slice(0, start) + tab + value.slice(end);
      templateBox.selectionStart = start + tab.length;
      templateBox.selectionEnd = start + tab.length;
    });
  });
</script>
{% endblock %}

{% block body %}
<h1 style="text-align: center; font-size: 40px; font-family: monospace;">Template Question Builder</h1>
<div class="clear_bordering">
  {% if status_message %}
  <p>{{ status_message }}</p>
  {% endif %}

  <form method="post">
    <div class="container"> <!-- style="display: flex; gap: 16px; align-items: flex-start;" -->
      <div class="column_left">
        <!-- question name -->
        <div class="text_spacing">
          <label for="question_name">Question Name</label><br />
        </div>
        <input id="question_name" name="question_name" type="text" size="60" value="{{ question_name }}" /><br /><br />
        <!-- prompt -->
        <div class="text_spacing">
          <label for="prompt_text">Prompt</label><br />
        </div>
        <textarea id="prompt_text" name="prompt_text" rows="4" cols="75">{{ prompt_text }}</textarea><br /><br />

        <div class="column_left"> <!-- style="display: flex; gap: 16px; align-items: flex-start;" -->
          <div>
            <!-- tags -->
            <div class="text_spacing">
              <label>Tags</label><br />
            </div>
            <div style="border: 1px solid #ccc; padding: 8px; width: 320px; max-height: 180px; overflow-y: auto;">
              {% for tag in available_tags %}
              <label style="display: block; margin-bottom: 4px;">
                <input type="checkbox" name="tag_ids" value="{{ tag.id }}" {% if tag.id in selected_tag_ids %}checked{%
                  endif %} />
                {{ tag.name }}
              </label>
              {% endfor %}
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 16px;">
            <div>
              <!-- question type -->
              <div class="text_spacing" style="margin-top: 40px;">
                <label for="question_type">Question Type</label><br />
              </div>
              <select id="question_type" name="question_type" style="width: 200px;">
                <option value="multiple_choice" {% if question_type=="multiple_choice" %}selected{% endif %}>Multiple
                  Choice</option>
                <option value="multiple_select" {% if question_type=="multiple_select" %}selected{% endif %}>Multiple
                  Select</option>
                <option value="short_answer" {% if question_type=="short_answer" %}selected{% endif %}>Short Answer
                </option>
                <option value="true_false" {% if question_type=="true_false" %}selected{% endif %}>True False</option>
              </select>
            </div>
            <div>
              <!-- language -->
              <div class="text_spacing">
                <label for="language">Language</label><br />
              </div>
              <select id="language" name="language" style="width: 200px;">
                <option value="C++" {% if language=="C++" %}selected{% endif %}>C++</option>
                <option value="Python" {% if language=="Python" %}selected{% endif %}>Python</option>
              </select>
            </div>
          </div>
        </div><br /><br />

        <!-- template input -->
        <div class="text_spacing">
          <label for="template_text">Template Input</label><br />
        </div>
        <textarea id="template_text" name="template_text" rows="24" cols="75">{{ template_text }}</textarea><br /><br />

        <!-- feedback -->
        <div class="text_spacing">
          <label for="feedback_text">Feedback</label><br />
        </div>
        <textarea id="feedback_text" name="feedback_text" rows="4" cols="75">{{ feedback_text }}</textarea><br /><br />

        <input type="hidden" name="selected_question_id" value="{{ selected_question_id }}" />

        <!-- buttons -->
        <div style="padding: 5px">
          <button type="submit" name="action" value="preview">Preview</button>
          <button type="submit" name="action" value="save">Save</button>
          <button type="submit" name="action" value="new">New Question</button>
        </div>
      </div>

      <div class="column_left" style="margin-left: 20px">
        <!-- saved questions -->
        <div class="text_spacing">
          <label for="chosen_question_id">Saved Questions</label><br />
        </div>
        <select id="chosen_question_id" name="chosen_question_id" size="20" style="width: 320px; overflow-y: auto;">
          {% for item in saved_questions %}
          <option value="{{ item.id }}" {% if item.id==selected_question_id %}selected{% endif %}>{{ item.title }}
          </option>
          {% endfor %}
        </select><br /><br />
        <!-- buttons -->
        <div style="padding: 5px">
          <button type="submit" name="action" value="load" style="margin-right: 3px">Load
            Selected</button>
          <button type="submit" name="action" value="delete" style="align-items: left;">Delete Selected</button>
        </div>
      </div>
    </div>
  </form>

</div>

<!-- preview output -->
<div class="clear_bordering_out_box" style="text-align: center;">
  <h2>Preview Output</h2>
  <textarea rows="20" cols="90" readonly style="max-width: 95%;
    max-height: 80%;">{{ preview_output }}</textarea>
</div>
{% endblock %}
